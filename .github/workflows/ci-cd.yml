name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── Detect which services changed ──────────────────────────────────────────
  # This job checks which folders were modified in the push.
  # Each output (auth, discounts, items, client) is either 'true' or 'false'.
  # Subsequent jobs use these outputs to decide whether to run.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      discounts: ${{ steps.filter.outputs.discounts }}
      items: ${{ steps.filter.outputs.items }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Check which paths changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'backend/auth/**'
            discounts:
              - 'backend/discounts/**'
            items:
              - 'backend/items/**'
            client:
              - 'client/**'

  # ── Build & Push auth (only if backend/auth changed) ──────────────────────
  build-auth:
    name: Build & Push Auth
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.10.0
      - uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6.16.0
        with:
          context: ./backend/auth
          file: ./backend/auth/Dockerfile.auth
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/restauranty-auth:latest

  # ── Build & Push discounts (only if backend/discounts changed) ─────────────
  build-discounts:
    name: Build & Push Discounts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.discounts == 'true'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.10.0
      - uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6.16.0
        with:
          context: ./backend/discounts
          file: ./backend/discounts/Dockerfile.discounts
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/restauranty-discounts:latest

  # ── Build & Push items (only if backend/items changed) ────────────────────
  build-items:
    name: Build & Push Items
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.items == 'true'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.10.0
      - uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6.16.0
        with:
          context: ./backend/items
          file: ./backend/items/Dockerfile.items
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/restauranty-items:latest

  # ── Build & Push client (only if client changed) ──────────────────────────
  build-client:
    name: Build & Push Client
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.client == 'true'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.10.0
      - uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6.16.0
        with:
          context: ./client
          file: ./client/Dockerfile.client
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/restauranty-client:latest
          build-args: |
            REACT_APP_SERVER_URL=

  # ── Deploy to AKS ──────────────────────────────────────────────────────────
  # always() means deploy runs even if some build jobs were skipped
  # !contains(needs.*.result, 'failure') means skip deploy if any build failed
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: [build-auth, build-discounts, build-items, build-client]
    if: |
      github.ref == 'refs/heads/main' &&
      always() &&
      !contains(needs.*.result, 'failure')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v3
        with:
          resource-group: hagen-restauranty-rg
          cluster-name: restauranty-aks

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f Solution/k8s/namespace.yaml
          kubectl apply -f Solution/k8s/mongo/
          kubectl apply -f Solution/k8s/auth/
          kubectl apply -f Solution/k8s/discounts/
          kubectl apply -f Solution/k8s/items/
          kubectl apply -f Solution/k8s/client/
          kubectl apply -f Solution/k8s/ingress.yaml

      - name: Restart only changed deployments
        run: |
          if [ "${{ needs.build-auth.result }}" == "success" ]; then
            kubectl rollout restart deployment/auth -n restauranty
          fi
          if [ "${{ needs.build-discounts.result }}" == "success" ]; then
            kubectl rollout restart deployment/discounts -n restauranty
          fi
          if [ "${{ needs.build-items.result }}" == "success" ]; then
            kubectl rollout restart deployment/items -n restauranty
          fi
          if [ "${{ needs.build-client.result }}" == "success" ]; then
            kubectl rollout restart deployment/client -n restauranty
          fi

      - name: Wait for rollouts
        run: |
          if [ "${{ needs.build-auth.result }}" == "success" ]; then
            kubectl rollout status deployment/auth -n restauranty
          fi
          if [ "${{ needs.build-discounts.result }}" == "success" ]; then
            kubectl rollout status deployment/discounts -n restauranty
          fi
          if [ "${{ needs.build-items.result }}" == "success" ]; then
            kubectl rollout status deployment/items -n restauranty
          fi
          if [ "${{ needs.build-client.result }}" == "success" ]; then
            kubectl rollout status deployment/client -n restauranty
          fi

      - name: Install Prometheus & Grafana
        run: |
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install monitoring \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --values Solution/monitoring/values.yaml
